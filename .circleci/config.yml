version: 2.1

executors:
  node_linux:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project

jobs:
  verify:
    executor: node_linux
    steps:
      - checkout

      - run:
          name: Verify CI checkout and SQLite transaction support
          command: |
            echo "CIRCLE_SHA1=${CIRCLE_SHA1}"
            echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            node --version
            node -e "const {DatabaseSync}=require('node:sqlite'); const db=new DatabaseSync(':memory:'); console.log('DatabaseSync.isTransaction type:', typeof db.isTransaction); console.log('DatabaseSync.isTransaction initial:', db.isTransaction); db.close();"
            echo "sqlite-database.js transaction helper:"
            nl -ba js/core/database/sqlite-database.js | sed -n '20,48p'

      - run:
          name: Install PDV dependencies
          command: npm install --no-audit --no-fund

      - run:
          name: Verify unit integration architecture release and security gates
          command: npm run verify:release

  qa_smoke:
    executor: node_linux
    steps:
      - checkout

      - run:
          name: Install PDV dependencies
          command: npm install --no-audit --no-fund

      - run:
          name: Install pinned ArtiSys QA runtime
          command: npm ci --prefix qa/runtime --no-audit --no-fund

      - run:
          name: Install Chromium and Linux browser dependencies
          command: |
            cd qa/runtime
            npx playwright install --with-deps chromium

      - run:
          name: Ensure capture tools are available
          command: |
            missing=()
            command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
            command -v xvfb-run >/dev/null 2>&1 || missing+=(xvfb)
            if [ ${#missing[@]} -gt 0 ]; then
              sudo apt-get update -y
              sudo apt-get install -y "${missing[@]}"
            fi

      - run:
          name: Run PDV configured quick QA profile
          command: |
            rm -rf qa-artifacts
            xvfb-run -a npm run qa:quick

      - store_artifacts:
          path: qa-artifacts
          destination: pdv-artisys/qa-smoke

workflows:
  pdv_ci:
    jobs:
      - verify
      - qa_smoke:
          requires:
            - verify
