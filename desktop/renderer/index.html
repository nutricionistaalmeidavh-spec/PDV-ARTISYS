<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'" />
  <title>ArtiSys PDV</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./operational-pages.css" />
  <link rel="stylesheet" href="./restaurant-ui.css" />
  <link rel="stylesheet" href="./vertical-modules.css" />
</head>
<body class="theme-home">
  <div class="desktop-frame">
    <aside id="app-sidebar" class="sidebar" aria-label="Navegação principal">
      <button class="brand-mark nav-button" data-route="home" title="ArtiSys PDV" aria-label="Ir para início"><span>A</span></button>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-spacer"></div>
      <button class="nav-button" data-route="settings" title="Configurações" aria-label="Configurações"><span data-icon="settings"></span></button>
      <button class="nav-button sidebar-back" data-route="home" title="Voltar ao início" aria-label="Voltar ao início">‹</button>
    </aside>

    <section class="app-column">
      <header id="app-topbar" class="topbar">
        <div class="topbar-brand"><strong>ARTISYS</strong><span>PDV</span></div>
        <div class="topbar-context">
          <div id="network-status" class="status-pill"><i></i><span>Rede Local</span></div>
          <div class="context-pill"><span data-icon="store"></span><strong id="store-name">Loja Matriz</strong></div>
          <div class="context-pill"><span data-icon="terminal"></span><strong id="terminal-name">Terminal PDV-01</strong></div>
          <button id="operator-button" class="context-pill operator-pill" type="button"><span data-icon="user"></span><strong id="operator-name">Sem operador</strong><small id="operator-role"></small></button>
          <div id="clock" class="clock"></div>
        </div>
        <div class="window-controls" aria-label="Controles da janela">
          <button type="button" data-window="minimize" aria-label="Minimizar">−</button>
          <button type="button" data-window="maximize" aria-label="Maximizar">□</button>
          <button type="button" data-window="close" aria-label="Fechar">×</button>
        </div>
      </header>

      <main id="route-content" class="route-content" tabindex="-1"></main>

      <footer class="app-footer">
        <div><strong>ARTISYS</strong><span>Tecnologia para o seu negócio.</span></div>
        <div><span id="footer-status" class="footer-status"><i></i>Sistema local</span><span id="app-version">Versão 0.0.0</span><span>Suporte ArtiSys</span></div>
      </footer>
    </section>
  </div>

  <div id="auth-overlay" class="overlay hidden" aria-live="polite"></div>
  <div id="modal-root" class="overlay hidden" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="./ui-model.js"></script>
  <script src="./currency-input.js"></script>
  <script src="./api-client.js"></script>
  <script src="./vertical-api-client.js"></script>
  <script src="./app.js"></script>
  <script src="./operational-pages.js"></script>
  <script src="./admin-ops.js"></script>
  <script src="./restaurant-ui.js"></script>
  <script src="./vertical-modules.js"></script>
  <script src="./e48-e54-ui.js"></script>
</body>
</html>
