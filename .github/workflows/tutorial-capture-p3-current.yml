name: Tutorial Capture P3 Current

on:
  push:
    branches:
      - feat/tutorial-videos-p3-current-20261007
    paths:
      - 'qa/demo/tutorials/**'
      - 'qa/runtime/adapters/tutorials-p1-p3.mjs'
      - 'qa/artisys-qa.config.json'
      - 'qa/tutorials/**'
      - 'scripts/tutorial-videos.mjs'
      - 'desktop/renderer/**'
      - '.github/workflows/tutorial-capture-p3-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-capture-p3-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tutorial contracts
        run: |
          node --test test/tutorial-p1-p3-capture.test.js
          npm run qa:tutorials:validate

  capture:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        demo:
          - 29-criar-usuario-operador
          - 30-alterar-permissoes
          - 31-parear-terminal
          - 32-configurar-impressora
          - 33-diagnostico-impressao
          - 34-fazer-backup
          - 35-restaurar-importar-dados
          - 36-ativar-desativar-modulos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install QA runtime dependencies
        run: npm ci --prefix qa/runtime --no-audit --no-fund
      - name: Ensure capture tools
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v xvfb-run >/dev/null 2>&1 || missing+=(xvfb)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Capture tutorial
        shell: bash
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          rm -rf "qa-artifacts-${DEMO}" tutorial-output
          xvfb-run -a node qa/runtime/artisys-qa.mjs demo \
            --config qa/artisys-qa.config.json \
            --demo "${DEMO}" \
            --profile tutorials-p1-p3 \
            --preset landscape-16x9 \
            --environment ci \
            --output "qa-artifacts-${DEMO}"
          RAW="$(find "qa-artifacts-${DEMO}" -name demo-video.mp4 -print -quit)"
          test -n "$RAW"
          mkdir -p tutorial-output
          npm run qa:tutorials:edit -- \
            --tutorial "${DEMO}" \
            --input "$RAW" \
            --output "tutorial-output/${DEMO}.mp4"
      - name: Upload final tutorial
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.demo }}
          path: tutorial-output/${{ matrix.demo }}.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-debug-${{ matrix.demo }}
          path: qa-artifacts-${{ matrix.demo }}
          if-no-files-found: warn
          retention-days: 7
