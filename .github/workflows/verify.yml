name: verify

on:
  push:
    branches:
      - main
      - "feat/**"
    paths-ignore:
      - '.github/qa-request.json'
  pull_request:
    paths-ignore:
      - '.github/qa-request.json'

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify unit integration architecture release and security gates
        run: npm run verify:release
