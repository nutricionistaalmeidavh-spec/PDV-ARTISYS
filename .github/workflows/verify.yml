name: verify

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-pdv-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTISYS_QA_FORM_FIXTURE: qa-managed-user-fixture

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check release capability parity
        run: npm run capability:check:release
      - name: Check phase 3 capability parity
        run: npm run capability:check:phase3
      - name: Check documentation consistency
        run: npm run docs:check
      - name: Run unit and integration tests with coverage
        shell: bash
        run: |
          mkdir -p coverage
          set -o pipefail
          NODE_V8_COVERAGE=coverage/v8 node --test --experimental-test-coverage test/*.test.js | tee coverage/test-coverage.txt
      - name: Upload code coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ github.run_number }}
          path: coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Test Cloudflare telemetry
        run: npm run test:telemetry:cloudflare
      - name: Lint EventBus
        run: npm run lint:eventbus
      - name: Lint core
        run: npm run lint:core
      - name: Lint desktop
        run: npm run lint:desktop
      - name: Lint commercial media
        run: npm run lint:commercial-media
