name: verify

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-pdv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify unit integration architecture release and capability gates
        run: npm run verify:release

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDV and QA peer dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y xvfb
          fi
      - name: Validate QA configuration
        run: npm run qa:validate
      - name: Run release E2E flows
        run: xvfb-run -a npm run qa:release
      - name: Run core checkout E2E at 1366x768
        run: xvfb-run -a node qa/runtime/artisys-qa.mjs run --config qa/artisys-qa.config.json --environment ci --flow core-business-e2e --viewport compactDesktop --output qa-artifacts
      - name: Run checkout UX exceptions at 1366x768
        run: xvfb-run -a node qa/runtime/artisys-qa.mjs run --config qa/artisys-qa.config.json --environment ci --flow checkout-ux-preservation --viewport compactDesktop --output qa-artifacts
      - name: Run desktop regressions at 1366x768
        run: xvfb-run -a node qa/runtime/artisys-qa.mjs run --config qa/artisys-qa.config.json --environment ci --flow desktop-regressions-e2e --viewport compactDesktop --output qa-artifacts
      - name: Run paired UX finalization
        run: xvfb-run -a npm run qa:ux:finalize
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdv-e2e-${{ github.run_number }}
          path: |
            qa-artifacts
            qa-report
            qa-results
          if-no-files-found: warn
          retention-days: 7

  fiscal-certification:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y xvfb
          fi
      - name: Run cumulative fiscal certification P25
        run: xvfb-run -a npm run fiscal:certify
      - name: Upload fiscal certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-certification-${{ github.run_number }}
          path: |
            release/fiscal-certification.json
            qa-artifacts
            qa-report
            qa-results
          if-no-files-found: warn
          retention-days: 14
