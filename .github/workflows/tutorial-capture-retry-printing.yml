name: Tutorial Capture Retry Printing 32 33

on:
  push:
    branches:
      - qa/tutorial-videos-full-refresh-food-20261007
    paths:
      - 'qa/desktop/main.cjs'
      - 'qa/artisys-qa.config.json'
      - 'qa/demo/tutorials/32-configurar-impressora.json'
      - 'qa/demo/tutorials/33-diagnostico-impressao.json'
      - 'test/tutorial-printing-capture.test.js'
      - '.github/workflows/tutorial-capture-retry-printing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/tutorial-printing-capture.test.js

  capture:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        demo:
          - 32-configurar-impressora
          - 33-diagnostico-impressao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install QA runtime dependencies
        run: npm ci --prefix qa/runtime --no-audit --no-fund
      - name: Ensure capture tools
        shell: bash
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v xvfb-run >/dev/null 2>&1; then
            timeout 120s sudo apt-get update -y
            timeout 120s sudo apt-get install -y ffmpeg xvfb
          fi
      - name: Capture tutorial
        shell: bash
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          rm -rf "qa-artifacts-${DEMO}" tutorial-output
          xvfb-run -a node qa/runtime/artisys-qa.mjs demo \
            --config qa/artisys-qa.config.json \
            --demo "${DEMO}" \
            --profile tutorials-p1-p3 \
            --preset landscape-16x9 \
            --environment printer-ci \
            --output "qa-artifacts-${DEMO}"
          RAW="$(find "qa-artifacts-${DEMO}" -name demo-video.mp4 -print -quit)"
          test -n "$RAW"
          mkdir -p tutorial-output
          npm run qa:tutorials:edit -- \
            --tutorial "${DEMO}" \
            --input "$RAW" \
            --output "tutorial-output/${DEMO}.mp4"
      - name: Upload final tutorial
        uses: actions/upload-artifact@v4
        with:
          name: retry-printing-${{ matrix.demo }}
          path: tutorial-output/${{ matrix.demo }}.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retry-printing-debug-${{ matrix.demo }}
          path: qa-artifacts-${{ matrix.demo }}
          if-no-files-found: warn
          retention-days: 7
