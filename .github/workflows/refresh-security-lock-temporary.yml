name: refresh-security-lock-temporary
on:
  push:
    branches: [fix/nonfiscal-release-security-20261111]
    paths:
      - package.json
      - .github/workflows/refresh-security-lock-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate reproducible dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json').packages['node_modules/xlsx'];if(p.name!=='@e965/xlsx'||p.version!=='0.20.3'||!p.integrity)process.exit(1)"
      - name: Commit lockfile to feature branch only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "chore(security): regenerate pinned npm lockfile with integrity"
          git push origin HEAD:fix/nonfiscal-release-security-20261111
