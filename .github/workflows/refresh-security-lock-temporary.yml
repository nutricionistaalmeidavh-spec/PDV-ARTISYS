name: refresh-security-lock-temporary
on:
  push:
    branches: [fix/nonfiscal-release-security-20261111]
    paths:
      - package.json
      - .github/workflows/refresh-security-lock-temporary.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified lockfile with patched Electron and minimatch
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(l.packages['node_modules/electron'].version!==p.devDependencies.electron||l.packages['node_modules/minimatch'].version!=='11.0.1')process.exit(1)"
      - name: Commit changed lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "chore(security): pin Electron and minimatch lockfile with integrity"
          git push origin HEAD:fix/nonfiscal-release-security-20261111
