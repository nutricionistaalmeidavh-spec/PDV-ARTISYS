name: Apply native dialog fix

on:
  push:
    branches: [fix/native-dialogs-ui]
    paths:
      - '.github/workflows/apply-native-dialog-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-dialogs-ui
          fetch-depth: 0
      - name: Replace native dialogs with app modals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('desktop/renderer/app.js')
          app = app_path.read_text(encoding='utf-8')

          close_line = "  function closeModal() { modalRoot.classList.add('hidden'); modalRoot.innerHTML = ''; }\n"
          expose = close_line + "  window.PdvModal = Object.freeze({ open: openModal, close: closeModal });\n"
          if 'window.PdvModal = Object.freeze' not in app:
              if close_line not in app:
                  raise SystemExit('closeModal anchor not found')
              app = app.replace(close_line, expose, 1)

          product_pattern = re.compile(r"  async function removeCatalogProduct\(productId\)\{.*?\n  \}\n\n  function monitorProductPhotoSync", re.S)
          product_replacement = '''  async function removeCatalogProduct(productId){
            const product=state.products.find(item=>item.id===productId);
            if(!product)return;
            openModal('Excluir produto', `<p>Excluir <strong>${escapeHtml(product.name)}</strong> do catálogo?</p><p>O produto será inativado para preservar vendas e movimentações já registradas.</p><div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Cancelar</button><button type="button" class="danger-button" id="confirm-remove-product">Excluir produto</button></div>`, { onMount(root) {
              root.querySelector('#confirm-remove-product')?.addEventListener('click',async()=>{
                try{
                  await api.removeProduct(productId);
                  state.products=state.products.filter(item=>item.id!==productId);
                  closeModal();
                  renderProducts();
                  showToast('Produto excluído do catálogo. Histórico preservado.','success');
                }catch(error){showToast(error.message,'error');}
              });
            } });
          }

          function monitorProductPhotoSync'''
          app, count = product_pattern.subn(product_replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'removeCatalogProduct replacement count={count}')

          photo_pattern = re.compile(r"  async function removeProductPhoto\(productId\)\{.*?\}\n\n  function openCategoryForm", re.S)
          photo_replacement = '''  async function removeProductPhoto(productId){
            openModal('Remover foto do produto', `<p>Remover a foto deste produto?</p><p>O arquivo ficará protegido por 30 dias.</p><div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Cancelar</button><button type="button" class="danger-button" id="confirm-remove-product-photo">Remover foto</button></div>`, { onMount(root) {
              root.querySelector('#confirm-remove-product-photo')?.addEventListener('click',async()=>{
                try{
                  await api.removeProductPhoto(productId);
                  state.products=await api.products();
                  closeModal();
                  renderProducts();
                  showToast('Foto removida com período de segurança de 30 dias.','success');
                }catch(error){showToast(error.message,'error');}
              });
            } });
          }

          function openCategoryForm'''
          app, count = photo_pattern.subn(photo_replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'removeProductPhoto replacement count={count}')

          if re.search(r'\b(?:window\.|root\.)?(?:prompt|confirm)\s*\(', app):
              raise SystemExit('native prompt/confirm remains in app.js')
          app_path.write_text(app, encoding='utf-8')

          reports_path = Path('desktop/renderer/reporting-v2.js')
          reports = reports_path.read_text(encoding='utf-8')
          ui_line = "  const ui = root.PdvUiModel;\n"
          if '  const modal = root.PdvModal;\n' not in reports:
              if ui_line not in reports:
                  raise SystemExit('report modal anchor not found')
              reports = reports.replace(ui_line, ui_line + "  const modal = root.PdvModal;\n", 1)

          commission_pattern = re.compile(r"    content\.querySelectorAll\('\[data-pay-commission\]'\)\.forEach\(button => button\.addEventListener\('click',async \(\) => \{.*?\n    \}\)\);", re.S)
          commission_replacement = '''    content.querySelectorAll('[data-pay-commission]').forEach(button => button.addEventListener('click',() => {
              const suggested = (Number(button.dataset.outstanding || 0) / 100).toFixed(2).replace('.',',');
              if (!modal?.open) { showToast('Modal interno indisponível.','error'); return; }
              modal.open('Registrar pagamento de comissão', `<form id="commission-payment-form"><div class="field"><label>Valor pago (R$) *</label><input name="amount" inputmode="decimal" required value="${escapeHtml(suggested)}"></div><div class="field"><label>Observação</label><textarea name="note" rows="3" placeholder="Opcional"></textarea></div><div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Cancelar</button><button type="submit" class="primary-button">Registrar pagamento</button></div></form>`, { onMount(modalRoot) {
                const form = modalRoot.querySelector('#commission-payment-form');
                const amount = form?.querySelector('[name="amount"]');
                amount?.focus();
                amount?.select();
                form?.addEventListener('submit',async event => {
                  event.preventDefault();
                  const amountCents = centsInput(form.elements.namedItem('amount')?.value);
                  if (amountCents <= 0) { showToast('Informe um valor de comissão maior que zero.','error'); return; }
                  const note = String(form.elements.namedItem('note')?.value || '').trim();
                  try {
                    await api.payCommission({sellerId:button.dataset.payCommission,amountCents,periodFrom:basePeriod.from,periodTo:basePeriod.to,note});
                    modal.close();
                    showToast('Pagamento de comissão registrado.','success');
                    await renderReportsV2();
                  } catch (error) { showToast(error.message,'error'); }
                });
              } });
            }));'''
          reports, count = commission_pattern.subn(commission_replacement, reports, count=1)
          if count != 1:
              raise SystemExit(f'commission replacement count={count}')
          if re.search(r'\b(?:window\.|root\.)?(?:prompt|confirm)\s*\(', reports):
              raise SystemExit('native prompt/confirm remains in reporting-v2.js')
          if "root.print()" not in reports:
              raise SystemExit('intentional report print action was lost')
          reports_path.write_text(reports, encoding='utf-8')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/renderer/app.js desktop/renderer/reporting-v2.js
          git diff --cached --check
          git commit -m "fix: replace native renderer dialogs with app modals"
          git push origin HEAD:fix/native-dialogs-ui
