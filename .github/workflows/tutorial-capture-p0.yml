name: Tutorial Capture P0

on:
  push:
    branches:
      - feat/tutorial-videos-30s
    paths:
      - 'qa/demo/tutorials/**'
      - 'qa/runtime/adapters/tutorials-p0.mjs'
      - 'qa/artisys-qa.config.json'
      - 'qa/tutorials/**'
      - 'scripts/tutorial-videos.mjs'
      - '.github/workflows/tutorial-capture-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-capture-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo:
          - 01-fazer-uma-venda
          - 02-buscar-adicionar-produto
          - 03-alterar-quantidade-remover-item
          - 04-aplicar-desconto
          - 05-identificar-cliente-vendedor
          - 06-finalizar-dinheiro-troco
          - 07-finalizar-pix-cartao
          - 08-pagamento-misto
          - 09-suspender-retomar-venda
          - 10-abrir-caixa
          - 11-sangria-suprimento
          - 12-fechar-caixa

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install QA runtime dependencies
        run: npm ci --prefix qa/runtime --no-audit --no-fund
      - name: Ensure capture tools
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v xvfb-run >/dev/null 2>&1 || missing+=(xvfb)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Capture tutorial
        shell: bash
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          rm -rf "qa-artifacts-${DEMO}" tutorial-output
          xvfb-run -a node qa/runtime/artisys-qa.mjs demo \
            --config qa/artisys-qa.config.json \
            --demo "${DEMO}" \
            --profile tutorials-p0 \
            --preset landscape-16x9 \
            --environment ci \
            --output "qa-artifacts-${DEMO}"

          RAW="$(find "qa-artifacts-${DEMO}" -name demo-video.mp4 -print -quit)"
          test -n "$RAW"
          mkdir -p tutorial-output
          npm run qa:tutorials:edit -- \
            --tutorial "${DEMO}" \
            --input "$RAW" \
            --output "tutorial-output/${DEMO}.mp4"

      - name: Upload final tutorial
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.demo }}
          path: tutorial-output/${{ matrix.demo }}.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-debug-${{ matrix.demo }}
          path: qa-artifacts-${{ matrix.demo }}
          if-no-files-found: warn
          retention-days: 7
