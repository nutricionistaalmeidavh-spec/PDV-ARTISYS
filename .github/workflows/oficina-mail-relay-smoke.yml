name: Oficina · Cloudflare relay connectivity
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/account/src/worker.mjs'
      - 'cloudflare/oficina-password-mailer/**'
      - '.github/workflows/oficina-mail-relay-smoke.yml'
jobs:
  relay-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production relay and Worker-to-Worker reachability
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ArtiSys-Oficina-QA/1.0'}),timeout=12) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as error:
                  print('PROBE_ERROR',url,error.code,error.read().decode('utf-8','replace')[:500],flush=True)
                  raise
          code,health=get('https://oficina-mail.artisys.dev/health')
          assert code==200 and health.get('ok') is True and health.get('emailReady') is True,(code,health)
          code,central=get('https://pdv-artisys.sistema-artisys.workers.dev/health')
          assert code==200 and central.get('service')=='artisys-account',(code,central)
          code,probe=get('https://oficina-relay-probe.sistema-artisys.workers.dev/')
          assert code==200 and probe.get('ok') is True and probe.get('status')==200,(code,probe)
          assert json.loads(probe.get('body','{}')).get('emailReady') is True,probe
          code,reverse=get('https://oficina-relay-reverse-probe.nutricionistaalmeidavh.workers.dev/')
          assert code==200 and reverse.get('ok') is True and reverse.get('status')==200,(code,reverse)
          assert json.loads(reverse.get('body','{}')).get('service')=='artisys-account',reverse
          print('Cloudflare Email healthy; both cross-account Worker directions reachable.')
          PY
