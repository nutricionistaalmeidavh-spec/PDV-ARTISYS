name: release-windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run release verification
        run: npm run verify:release
      - name: Build Windows x64 installer
        run: npm run dist:win
      - name: Generate release manifest and SHA-256
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Instalador Windows não encontrado em dist.' }
          $env:VERIFY_RESULT = 'pass'
          $env:VERIFY_RELEASE_RESULT = 'pass'
          $env:WINDOWS_BUILD_RESULT = 'pass'
          npm run release:manifest -- --output dist/release-manifest.json --artifact $installer
          Get-FileHash -Algorithm SHA256 $installer | Format-List
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: artisys-pdv-windows-x64
          path: |
            dist/*Setup.exe
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = (Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          $manifest = (Resolve-Path 'dist/release-manifest.json').Path
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $manifest --clobber
          } else {
            gh release create $tag $installer $manifest --title "ArtiSys PDV $version" --notes-file release/release-notes.md --target $env:GITHUB_SHA
          }
