name: release-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

concurrency:
  group: release-windows-main
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve automatic release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $latestTag = '-'
          $latestTarget = '-'
          $latestJson = gh api "repos/${{ github.repository }}/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestJson) {
            $latestRelease = $latestJson | ConvertFrom-Json
            $latestTag = [string]$latestRelease.tag_name
            $latestTarget = [string]$latestRelease.target_commitish
          }
          $version = node scripts/resolve-release-version.js --package-version $packageVersion --latest-release-tag $latestTag --latest-target $latestTarget --current-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Não foi possível resolver a versão automática da release.' }
          $version = $version.Trim()
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Release version: $version"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for browser-backed tests
        run: npx playwright install --with-deps chromium
      - name: Run release verification
        run: npm run verify:release
      - name: Apply release version
        shell: pwsh
        run: npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
      - name: Install OSS Windows compiler prerequisites
        shell: pwsh
        run: |
          choco install lazarus --version=4.0.0 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Lazarus/FPC OSS installation failed' }
          choco install sliksvn --version=1.14.5 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'SlikSVN OSS installation failed' }
          # The Chocolatey package can omit bin from PATH. Persist it across Actions steps.
          $svnBin = Join-Path $env:ProgramFiles 'SlikSvn\bin'
          if (!(Test-Path (Join-Path $svnBin 'svn.exe'))) { throw 'svn.exe missing after installing SlikSVN' }
          $env:PATH = "$svnBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $svnBin
          & svn --version --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Subversion CLI probe failed' }
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          $lazbuild = 'C:\lazarus\lazbuild.exe'
          if (!(Test-Path $lazbuild)) {
            $cmd = Get-Command lazbuild -ErrorAction SilentlyContinue
            if (!$cmd) { throw 'Lazarus compiler missing after installation' }
            $lazbuild = $cmd.Source
          }
          & $lazbuild --version
          if ($LASTEXITCODE -ne 0) { throw 'Lazarus toolchain not available' }
      - name: Build and verify native ACBr OSS bundle
        shell: pwsh
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          & ./scripts/fiscal/build-windows-native.ps1
      - name: Build Windows x64 installer (native ACBr bundled, production emission still disabled)
        run: npm run dist:win:fiscal
      - name: Verify packaged native resources
        shell: pwsh
        run: |
          node -e "const {verifyAcbrBundle}=require('./server/acbrlib/bundle-verifier');const path=require('path');const result=verifyAcbrBundle({resourcesPath:path.resolve('dist/win-unpacked/resources'),platform:'win32',arch:'x64'});if(!result.valid)throw Error('Packaged ACBr bundle invalid: '+result.reason);console.log('ACBr revision',result.revision)"
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path dist/win-unpacked -Filter '*.exe' | Where-Object { $_.Name -notmatch 'elevate' } | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Executável empacotado não encontrado para smoke test.' }
          $env:PDV_ENABLE_LAN = 'false'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Aplicativo empacotado encerrou durante a inicialização. ExitCode=$($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Generate release manifest and SHA-256
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Instalador Windows não encontrado em dist.' }
          $env:VERIFY_RESULT = 'pass'
          $env:VERIFY_RELEASE_RESULT = 'pass'
          $env:WINDOWS_BUILD_RESULT = 'pass'
          npm run release:manifest -- --output dist/release-manifest.json --artifact $installer
          Get-FileHash -Algorithm SHA256 $installer | Format-List
      - name: Validate updater metadata
        shell: pwsh
        run: |
          $latest = (Get-ChildItem -Path dist -Filter 'latest.yml' | Select-Object -First 1).FullName
          if (-not $latest) { throw 'latest.yml não foi gerado pelo electron-builder.' }
          $blockmaps = @(Get-ChildItem -Path dist -Filter '*.blockmap')
          if ($blockmaps.Count -eq 0) { throw 'Blockmap do updater não foi gerado pelo electron-builder.' }
          Write-Host "Updater metadata: $latest"
          $blockmaps | ForEach-Object { Write-Host "Blockmap: $($_.FullName)" }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: artisys-pdv-windows-x64-${{ env.RELEASE_VERSION }}
          path: |
            dist/*Setup.exe
            dist/*.blockmap
            dist/latest.yml
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $installer = (Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          $latest = (Resolve-Path 'dist/latest.yml').Path
          $manifest = (Resolve-Path 'dist/release-manifest.json').Path
          $blockmaps = @(Get-ChildItem -Path dist -Filter '*.blockmap' | ForEach-Object { $_.FullName })
          $assets = @($installer, $latest, $manifest) + $blockmaps

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assets --repo "${{ github.repository }}" --clobber
          } else {
            $notes = "Instalador Windows e metadados de atualização automática gerados e validados pelo CI para o commit $env:GITHUB_SHA."
            & gh release create $tag @assets --repo "${{ github.repository }}" --title "ArtiSys PDV $version" --notes $notes --target $env:GITHUB_SHA
          }
