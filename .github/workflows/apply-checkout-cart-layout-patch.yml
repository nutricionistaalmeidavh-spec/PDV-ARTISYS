name: Apply checkout cart layout patch

on:
  push:
    branches:
      - fix/checkout-cart-responsive-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cart-layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkout-cart-responsive-layout
          fetch-depth: 0

      - name: Patch cartLine and responsive CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('desktop/renderer/app.js')
          app = app_path.read_text()
          old = '''  function cartLine(item) {
            const changed = item.catalogUnitPriceCents != null && item.catalogUnitPriceCents !== item.unitPriceCents;
            const priceDetails = changed ? `<small><s>${ui.formatCents(item.catalogUnitPriceCents)}</s> → ${ui.formatCents(item.unitPriceCents)}${item.priceOverrideReason ? ` · ${escapeHtml(item.priceOverrideReason)}` : ''}</small>` : `<small>${ui.formatCents(item.unitPriceCents)}</small>`;
            const priceButton = ['admin','manager'].includes(state.user?.role) ? `<button type="button" class="secondary-button" data-price-item="${item.id}" style="padding:4px 7px;margin-top:4px">Alterar preço</button>` : '';
            return `<div class="cart-line ${state.selectedProductId === item.productId ? 'selected' : ''}" data-select-product="${item.productId}"><div><strong>${escapeHtml(item.productName)}</strong>${priceDetails}${priceButton}</div><div class="qty-control"><button type="button" data-qty-minus="${item.productId}">−</button><span>${quantityLabel(item.quantity)}</span><button type="button" data-qty-plus="${item.productId}">＋</button></div><div class="line-total">${ui.formatCents(item.totalCents)} <button type="button" data-remove="${item.productId}" style="border:0;background:transparent;color:#e22;font-size:18px">×</button></div></div>`;
          }
          '''
          new = '''  function cartLine(item) {
            const changed = item.catalogUnitPriceCents != null && item.catalogUnitPriceCents !== item.unitPriceCents;
            const priceDetails = changed ? `<small><s>${ui.formatCents(item.catalogUnitPriceCents)}</s> → ${ui.formatCents(item.unitPriceCents)}${item.priceOverrideReason ? ` · ${escapeHtml(item.priceOverrideReason)}` : ''}</small>` : `<small>${ui.formatCents(item.unitPriceCents)}</small>`;
            const priceButton = ['admin','manager'].includes(state.user?.role) ? `<button type="button" class="secondary-button cart-line-price-action" data-price-item="${item.id}">Alterar preço</button>` : '';
            return `<div class="cart-line ${state.selectedProductId === item.productId ? 'selected' : ''}" data-select-product="${item.productId}"><div class="cart-line-product"><strong class="cart-line-name">${escapeHtml(item.productName)}</strong>${priceDetails}${priceButton}</div><div class="qty-control"><button type="button" data-qty-minus="${item.productId}">−</button><span>${quantityLabel(item.quantity)}</span><button type="button" data-qty-plus="${item.productId}">＋</button></div><div class="line-total">${ui.formatCents(item.totalCents)} <button type="button" data-remove="${item.productId}" style="border:0;background:transparent;color:#e22;font-size:18px">×</button></div></div>`;
          }
          '''
          if old not in app:
              raise SystemExit('cartLine source block not found')
          app_path.write_text(app.replace(old, new, 1))

          css_path = Path('desktop/renderer/ux-home-checkout.css')
          css = css_path.read_text()
          marker = '/* Responsive cart-line contract: compact desktop */'
          if marker in css:
              raise SystemExit('responsive cart CSS already applied')
          css += '''

          /* Responsive cart-line contract: compact desktop */
          .checkout-view .cart-line {
            grid-template-columns:minmax(0,1fr) auto auto;
          }
          .checkout-view .cart-line-product {
            min-width:0;
          }
          .checkout-view .cart-line-name {
            overflow-wrap:anywhere;
            word-break:break-word;
            line-height:1.3;
          }
          .checkout-view .cart-line-product small {
            display:block;
            max-width:100%;
            overflow-wrap:anywhere;
          }
          .checkout-view .cart-line-price-action {
            margin-top:6px;
            padding:4px 8px;
            font-size:11px;
            max-width:100%;
            white-space:normal;
          }
          @media (max-width:1399px) {
            .checkout-view .cart-line {
              grid-template-columns:minmax(0,1fr) auto;
              grid-template-areas:
                "product total"
                "product quantity";
              align-items:start;
              column-gap:12px;
              row-gap:8px;
            }
            .checkout-view .cart-line-product {
              grid-area:product;
            }
            .checkout-view .cart-line .qty-control {
              grid-area:quantity;
              justify-self:end;
            }
            .checkout-view .cart-line .line-total {
              grid-area:total;
              justify-self:end;
            }
          }
          '''
          css_path.write_text(css)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/renderer/app.js desktop/renderer/ux-home-checkout.css
          git commit -m "fix: reflow checkout cart lines [cart-layout-applied]"
          git push origin HEAD:fix/checkout-cart-responsive-layout
