name: hardening-autofix

on:
  push:
    branches:
      - fix/hardening-modules-release-1.4.12
    paths:
      - '.github/workflows/hardening-autofix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening implementation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const read=file=>fs.readFileSync(file,'utf8');
          const write=(file,content)=>{fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,content);};
          const replace=(file,from,to)=>{const source=read(file);if(!source.includes(from))throw new Error(`Expected fragment not found in ${file}: ${from.slice(0,80)}`);write(file,source.replace(from,to));};
          const addRequire=(file)=>{
            const source=read(file);
            if(source.includes("require('./http-error-status')"))return;
            if(!source.startsWith("'use strict';"))throw new Error(`Unexpected header in ${file}`);
            write(file,source.replace("'use strict';","'use strict';\nconst {statusForError}=require('./http-error-status');"));
          };

          // Cross-client Restaurant module reconciliation.
          replace('desktop/renderer/restaurant-module-gate.js',
            "  const GATE_STYLE_ID='restaurant-module-gate-style';\n",
            "  const GATE_STYLE_ID='restaurant-module-gate-style';\n  const REFRESH_INTERVAL_MS=5000;\n");
          replace('desktop/renderer/restaurant-module-gate.js',
            "  root.PdvRestaurantModuleGate=Object.freeze({\n",
            "  root.addEventListener('focus',()=>{void refresh();});\n  document.addEventListener('visibilitychange',()=>{if(!document.hidden)void refresh();});\n  if(typeof root.setInterval==='function')root.setInterval(()=>{void refresh();},REFRESH_INTERVAL_MS);\n\n  root.PdvRestaurantModuleGate=Object.freeze({\n");

          // QA public-boundary action: call Electron's existing desktop API bridge directly.
          replace('qa/runtime/src/steps.js',
            "    case 'setFeatureFlags': {",
            `    case 'desktopApiRequest': {\n      const requestPath=String(step.path||'').trim();\n      if(!requestPath.startsWith('/api/v1/'))throw new Error(\`${'${label}'}: desktopApiRequest requires /api/v1/ path\`);\n      const result=await page.evaluate(async input=>{\n        if(typeof window.artisysDesktop?.apiRequest!=='function')throw new Error('Desktop API bridge unavailable');\n        const sessionToken=sessionStorage.getItem('pdv.session')||null;\n        return window.artisysDesktop.apiRequest({path:input.path,method:input.method||'GET',body:input.body,sessionToken});\n      },{path:requestPath,method:String(step.method||'GET').toUpperCase(),body:step.body??null});\n      if(step.expectedStatus!=null&&Number(result?.status)!==Number(step.expectedStatus))throw new Error(\`${'${label}'}: expected HTTP ${'${step.expectedStatus}'}, got ${'${result?.status}'}\`);\n      if(step.expectOk!==false&&!result?.ok)throw new Error(\`${'${label}'}: desktop API request failed: ${'${JSON.stringify(result?.payload||null)}'}\`);\n      break;\n    }\n    case 'setFeatureFlags': {`);

          const flow={
            name:'restaurant-module-sync-e2e',
            steps:[
              {action:'waitFor',selector:'#setup-form',name:'setup-ready',timeoutMs:15000},
              {action:'fill',selector:"#setup-form input[name='name']",value:'QA Module Sync',name:'setup-admin-name'},
              {action:'fill',selector:"#setup-form input[name='username']",value:'qamodulesync',name:'setup-admin-username'},
              {action:'fill',selector:"#setup-form input[name='password']",value:'QaModuleSync-12345!',name:'setup-admin-password'},
              {action:'click',selector:"#setup-form button[type='submit']",name:'qa-admin-setup'},
              {action:'waitFor',selector:'#login-form',name:'login-ready',timeoutMs:10000},
              {action:'fill',selector:"#login-form input[name='username']",value:'qamodulesync',name:'login-username'},
              {action:'fill',selector:"#login-form input[name='password']",value:'QaModuleSync-12345!',name:'login-password'},
              {action:'click',selector:"#login-form button[type='submit']",name:'qa-login'},
              {action:'waitFor',selector:'#auth-overlay',state:'hidden',name:'authenticated',timeoutMs:10000},
              {action:'waitFor',selector:"#route-content [data-restaurant-route]",name:'restaurant-launcher-visible',timeoutMs:10000},
              {action:'desktopApiRequest',path:'/api/v1/settings/modules.RESTAURANT.enabled',method:'PUT',body:{value:false,scope:'global'},expectedStatus:200,name:'disable-restaurant-outside-api-client'},
              {action:'waitFor',selector:"#route-content [data-restaurant-route]",state:'hidden',name:'restaurant-launcher-hidden-after-external-change',timeoutMs:12000},
              {action:'desktopApiRequest',path:'/api/v1/settings/modules.RESTAURANT.enabled',method:'PUT',body:{value:true,scope:'global'},expectedStatus:200,name:'enable-restaurant-outside-api-client'},
              {action:'waitFor',selector:"#route-content [data-restaurant-route]",state:'visible',name:'restaurant-launcher-restored-after-external-change',timeoutMs:12000}
            ]
          };
          write('qa/flows/restaurant-module-sync-e2e.json',JSON.stringify(flow,null,2)+'\n');
          const qa=JSON.parse(read('qa/artisys-qa.config.json'));
          qa.flows['restaurant-module-sync-e2e']='flows/restaurant-module-sync-e2e.json';
          for(const profileName of ['full','release']){
            for(const key of ['flows','criticalFlows'])if(!qa.qaProfiles[profileName][key].includes('restaurant-module-sync-e2e'))qa.qaProfiles[profileName][key].push('restaurant-module-sync-e2e');
          }
          write('qa/artisys-qa.config.json',JSON.stringify(qa,null,2)+'\n');

          // HTTP classification shared by routers: unknown exceptions are 500, known conflicts remain 409.
          write('server/http-error-status.js',`'use strict';\n\nfunction statusForError(error,{uniqueConflict=true}={}){\n  const explicit=Number(error?.statusCode);\n  if(Number.isInteger(explicit)&&explicit>=400&&explicit<=599)return explicit;\n  if(error?.code==='MODULE_DISABLED')return 409;\n  if(uniqueConflict&&/UNIQUE constraint failed/i.test(String(error?.message||'')))return 409;\n  return 500;\n}\n\nmodule.exports={statusForError};\n`);
          for(const file of ['server/receipt-router.js','server/return-authorization-router.js','server/restaurant-router.js','server/kit-combo-router.js','server/product-variant-router.js','server/fiscal-block6-router.js','server/vertical-router.js'])addRequire(file);
          replace('server/receipt-router.js','Number(error.statusCode||400)','statusForError(error)');
          replace('server/return-authorization-router.js','error.statusCode || 400','statusForError(error)');
          replace('server/fiscal-block6-router.js','Number(error.statusCode || 400)','statusForError(error)');
          for(const file of ['server/kit-combo-router.js','server/product-variant-router.js']){
            replace(file,"const status=error.statusCode||(/UNIQUE constraint failed/.test(error.message||'')?409:400);","const status=statusForError(error);");
          }
          replace('server/restaurant-router.js',"const status=error.statusCode||(error.code==='MODULE_DISABLED'?409:/UNIQUE constraint failed/.test(error.message||'')?409:400);","const status=statusForError(error);");
          const vertical=read('server/vertical-router.js');
          write('server/vertical-router.js',vertical.replace(/const status=error\.statusCode\|\|\(error\.code==='MODULE_DISABLED'\?409:\/UNIQUE constraint failed\/\.test\(error\.message\|\|''\)\?409:400\);/g,"const status=statusForError(error);"));

          // Deterministic dependency installs in supported CI/release workflows.
          for(const file of ['.github/workflows/verify.yml','.github/workflows/release-windows.yml','.github/workflows/qa-capture.yml']){
            write(file,read(file).replaceAll('npm install --no-audit --no-fund','npm ci --no-audit --no-fund'));
          }
          replace('.github/workflows/build-windows-legacy.yml','npm install --ignore-scripts --no-package-lock','npm ci --ignore-scripts --no-audit --no-fund');
          replace('test/e29-final-release.test.js','assert.match(verify, /npm install/);','assert.match(verify, /npm ci/);');

          // Version-neutral release checklist: release version is resolved at build time.
          write('release/release-checklist.md',`# ArtiSys PDV — Release checklist\n\nA release só é considerada publicável quando todos os gates abaixo são comprovados no mesmo HEAD. A versão distribuída não é hardcoded neste documento: o workflow resolve \`RELEASE_VERSION\` com \`scripts/resolve-release-version.js\` imediatamente antes do build.\n\n## Gates técnicos\n\n- [ ] \`npm ci --no-audit --no-fund\` instala exatamente o grafo do lockfile raiz.\n- [ ] \`npm run verify:release\` verde no HEAD final.\n- [ ] Perfil QA \`release\` verde, incluindo regressões de checkout, módulos e navegação.\n- [ ] Certificação fiscal cumulativa verde quando aplicável.\n- [ ] Windows x64 NSIS gerado no CI a partir do mesmo HEAD.\n- [ ] Executável empacotado passa no smoke test sem encerramento prematuro.\n- [ ] \`latest.yml\` e blockmap do updater são gerados e validados.\n- [ ] Manifesto e SHA-256 são gerados a partir do mesmo instalador.\n- [ ] Artefato final usa \`ArtiSys-PDV-\${RELEASE_VERSION}-x64-Setup.exe\`.\n- [ ] GitHub Release usa a tag \`v\${RELEASE_VERSION}\` e aponta para o mesmo commit verificado.\n- [ ] Gates pós-merge em \`main\` permanecem verdes.\n\n## Invariantes operacionais\n\n- SQLite permanece autoritativo no servidor local; terminais usam a API LAN.\n- \`SaleService\` permanece o motor canônico de conclusão de vendas.\n- Módulos opcionais desativados não aparecem como fluxo operacional e não aceitam mutações específicas no backend.\n- O núcleo obrigatório continua local-first/self-hosted, sem SaaS, nuvem ou assinatura obrigatória.\n\n## Validação física\n\nA CI valida contratos, protocolo, recuperação, framing, parser e simulações, mas não substitui eletrônica, firmware, cabo, driver e teste do equipamento físico.\n\n- \`PROTOCOL_VERIFIED\`: protocolo coberto pela suíte automatizada;\n- \`FIELD_VERIFIED\`: fabricante/modelo testado fisicamente com evidência;\n- \`UNTESTED_MODEL\`: modelo específico ainda não validado em campo.\n`);
          const checker=read('scripts/check-docs-consistency.js');
          if(!checker.includes('assertReleaseChecklistVersionNeutral')){
            const marker="\nconsole.log(`Documentation consistency OK for ArtiSys PDV ${pkg.version}.`);";
            const addition=`\nfunction assertReleaseChecklistVersionNeutral() {\n  const checklist = read('release/release-checklist.md');\n  if (/^#.*\\bv?\\d+\\.\\d+\\.\\d+/m.test(checklist)) fail('release checklist title must not hardcode a SemVer.');\n  if (/ArtiSys-PDV-\\d+\\.\\d+\\.\\d+-x64-Setup\\.exe/.test(checklist)) fail('release checklist artifact must use RELEASE_VERSION instead of a hardcoded SemVer.');\n  if (!checklist.includes('RELEASE_VERSION') || !checklist.includes('resolve-release-version.js')) fail('release checklist must document dynamic release version resolution.');\n}\nassertReleaseChecklistVersionNeutral();\n`;
            if(!checker.includes(marker))throw new Error('docs checker insertion marker not found');
            write('scripts/check-docs-consistency.js',checker.replace(marker,addition+marker));
          }
          const restaurantDoc='docs/architecture/e30-e39-restaurant.md';
          const restaurantMarker='## Gate do módulo no boundary HTTP';
          if(fs.existsSync(restaurantDoc)&&!read(restaurantDoc).includes(restaurantMarker))write(restaurantDoc,read(restaurantDoc)+`\n\n${restaurantMarker}\n\nAs rotas desktop e mobile específicas de Restaurante autenticam o chamador e, em seguida, exigem \`modules.requireEnabled('RESTAURANT')\`. Com o módulo desligado, novas operações específicas são rejeitadas com \`MODULE_DISABLED\`; o serviço interno permanece disponível para drenar efeitos duráveis já persistidos. O renderer reconcilia o estado no foco, retorno de visibilidade e em intervalo local para refletir mudanças feitas por outro terminal.\n`);
          NODE
      - name: Generate root package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop qa server .github/workflows/verify.yml .github/workflows/release-windows.yml .github/workflows/qa-capture.yml .github/workflows/build-windows-legacy.yml package-lock.json release scripts test docs/architecture/e30-e39-restaurant.md
          git commit -m 'fix: harden modules errors and release reproducibility'
          git push origin HEAD:fix/hardening-modules-release-1.4.12
