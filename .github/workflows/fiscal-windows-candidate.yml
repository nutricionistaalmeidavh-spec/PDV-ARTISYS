name: fiscal-windows-candidate

on:
  push:
    branches:
      - feat/fiscal-acbrlib-oss-oficina
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/acbrlib-desktop-runtime.cjs'
      - 'desktop/main.cjs'
      - 'server/acbrlib/**'
      - 'scripts/fiscal/**'
      - 'package.json'
      - 'test/fiscal-*'
      - '.github/workflows/fiscal-windows-candidate.yml'
      - '.github/workflows/release-windows.yml'

permissions:
  contents: read

concurrency:
  group: fiscal-windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Test fresh and existing installations before native build
        run: node --test test/fiscal-windows-installation.test.js test/fiscal-acbrlib-build-config.test.js test/installation-lifecycle-integration.test.js
      - name: Install OSS Windows toolchain
        shell: pwsh
        run: |
          choco install lazarus --version=4.0.0 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Lazarus/FPC toolchain installation failed' }
          choco install sliksvn --version=1.14.5 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'SlikSVN OSS installation failed' }
          # The Chocolatey package can omit bin from PATH. Persist it across Actions steps.
          $svnBin = Join-Path $env:ProgramFiles 'SlikSvn\bin'
          if (!(Test-Path (Join-Path $svnBin 'svn.exe'))) { throw 'svn.exe missing after installing SlikSVN' }
          $env:PATH = "$svnBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $svnBin
          & svn --version --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Subversion CLI probe failed' }
      - name: Build ACBrLib and probe real DLL exports (no certificate, no SEFAZ)
        shell: pwsh
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          & ./scripts/fiscal/build-windows-native.ps1
      - name: Package ArtiSys fiscal candidate (never publish)
        run: npm run dist:win:fiscal
      - name: Verify bundled resources and new-PC application launch
        shell: pwsh
        run: |
          node -e "const {verifyAcbrBundle}=require('./server/acbrlib/bundle-verifier');const path=require('path');const result=verifyAcbrBundle({resourcesPath:path.resolve('dist/win-unpacked/resources'),platform:'win32',arch:'x64'});if(!result.valid)throw Error(result.reason);console.log('Verified ACBr native revision:',result.revision)"
          $exe = Join-Path (Resolve-Path 'dist/win-unpacked').Path 'ArtiSys PDV.exe'
          if (!(Test-Path $exe)) { throw 'ArtiSys PDV.exe missing: changing executable name would break existing installs' }
          $env:PDV_ENABLE_LAN='false'
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'artisys-new-pc-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $process=Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) { throw "Fresh Windows installation exited with $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke test NSIS installer on a new Windows user profile
        shell: pwsh
        run: |
          $setup=(Get-ChildItem -Path dist -Filter '*Setup.exe' | Select-Object -First 1).FullName
          if(-not $setup) { throw 'Instalador NSIS não foi gerado' }
          $installation=Join-Path $env:RUNNER_TEMP 'ArtiSys-NSIS-NewMachine'
          $profile=Join-Path $env:RUNNER_TEMP 'ArtiSys-NSIS-APPDATA'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $proc=Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$installation") -PassThru -Wait
          if($proc.ExitCode -ne 0) { throw "Instalação silenciosa NSIS falhou: $($proc.ExitCode)" }
          $exe=Join-Path $installation 'ArtiSys PDV.exe'
          if(!(Test-Path $exe)) { throw 'Instalador alterou o nome do executável ou não instalou' }
          $env:APPDATA=$profile
          $env:ARTISYS_QA='1'
          $env:ARTISYS_QA_AUTO_LOCAL='1'
          $env:ARTISYS_QA_AUTO_ADMIN='1'
          $instance=Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 20
            if($instance.HasExited) { throw "Executável instalado encerrou antes da inicialização: $($instance.ExitCode)" }
            $dbs=@(Get-ChildItem -Path $profile -Recurse -Filter 'pdv-artisys.sqlite' -File)
            if($dbs.Count -ne 1) { throw "Banco local da instalação nova ausente ou duplicado: $($dbs.Count)" }
          } finally {
            if(!$instance.HasExited) { Stop-Process -Id $instance.Id -Force }
          }
      - name: Upload installer for review (never release to customers)
        uses: actions/upload-artifact@v4
        with:
          name: ArtiSys-Fiscal-Windows-Candidate
          path: |
            dist/*Setup.exe
            dist/latest.yml
            dist/*.blockmap
          retention-days: 7
          if-no-files-found: error
