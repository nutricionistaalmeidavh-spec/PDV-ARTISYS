name: debug-verify-hardening

on:
  push:
    branches:
      - fix/hardening-modules-release-1.4.12
    paths:
      - '.github/workflows/debug-verify-hardening.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Capture failing verification summary
        shell: bash
        run: |
          set +e
          npm run verify:release > /tmp/verify.log 2>&1
          code=$?
          node <<'NODE'
          const fs=require('node:fs');
          const lines=fs.readFileSync('/tmp/verify.log','utf8').split(/\r?\n/);
          const hits=[];
          for(let i=0;i<lines.length;i++){
            if(/not ok|AssertionError|ERR_ASSERTION|npm ERR|Error:|failed|failure|MODULE_NOT_FOUND|SyntaxError/i.test(lines[i])){
              const start=Math.max(0,i-4),end=Math.min(lines.length,i+14);
              hits.push(lines.slice(start,end).join('\n'));
            }
          }
          const unique=[...new Set(hits)];
          fs.writeFileSync('debug-verify.txt',unique.slice(0,25).join('\n\n---\n\n')||'No matching failure lines found.\n');
          NODE
          echo "exit_code=$code" >> debug-verify.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-verify.txt
          git commit -m 'chore: capture verify failure diagnostic'
          git push origin HEAD:fix/hardening-modules-release-1.4.12
