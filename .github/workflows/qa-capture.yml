name: QA Capture

on:
  push:
    branches:
      - audit/product-design-cardapio-20261002
  workflow_dispatch:
    inputs:
      demo:
        description: Fluxo de demonstração
        required: true
        default: quick-30s
        type: choice
        options: [quick-30s, overview-60s]
      preset:
        description: Formato do vídeo de demonstração
        required: true
        default: reels-9x16
        type: choice
        options: [reels-9x16, landscape-16x9, square-1x1]

permissions:
  contents: read

concurrency:
  group: qa-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PDV
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDV dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned ArtiSys QA runtime
        run: npm ci --prefix qa/runtime --no-audit --no-fund
      - name: Ensure capture tools are available
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v xvfb-run >/dev/null 2>&1 || missing+=(xvfb)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Capture Product Design audit flow
        id: capture
        shell: bash
        run: |
          rm -rf qa-artifacts
          echo "artifact_name=pdv-product-design-cardapio-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          xvfb-run -a node qa/runtime/artisys-qa.mjs run \
            --config qa/artisys-qa.config.json \
            --flow product-design-menu-audit \
            --environment ci \
            --viewport desktop \
            --output qa-artifacts
      - name: Upload screenshots videos traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.capture.outputs.artifact_name || format('pdv-qa-capture-{0}', github.run_number) }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
