name: QA Capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: QA técnico visual ou vídeo de demonstração
        required: true
        default: demo
        type: choice
        options: [demo, qa]
      flow:
        description: Fluxo QA
        required: true
        default: smoke
        type: choice
        options: [smoke, home]
      demo:
        description: Fluxo de demonstração
        required: true
        default: quick-30s
        type: choice
        options: [quick-30s, overview-60s]
      preset:
        description: Formato do vídeo de demonstração
        required: true
        default: reels-9x16
        type: choice
        options: [reels-9x16, landscape-16x9, square-1x1]
      environment:
        description: Ambiente
        required: true
        default: ci
        type: choice
        options: [ci]
      viewport:
        description: Viewport do QA
        required: true
        default: desktop
        type: choice
        options: [desktop, tablet, mobile]
  pull_request:
    paths:
      - 'qa/**'
      - 'test/artisys-qa-integration.test.js'
      - '.github/workflows/qa-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PDV
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDV dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned ArtiSys QA runtime
        run: npm ci --prefix qa/runtime --no-audit --no-fund
      - name: Install visual capture dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb
      - name: Capture PDV flow
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FLOW: ${{ inputs.flow }}
          INPUT_DEMO: ${{ inputs.demo }}
          INPUT_PRESET: ${{ inputs.preset }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_VIEWPORT: ${{ inputs.viewport }}
        run: |
          MODE="${INPUT_MODE:-demo}"
          ENVIRONMENT="${INPUT_ENVIRONMENT:-ci}"
          if [ "$MODE" = "demo" ]; then
            DEMO="${INPUT_DEMO:-quick-30s}"
            PRESET="${INPUT_PRESET:-reels-9x16}"
            ARTISYS_QA_DEMO_PASSWORD="$(openssl rand -hex 16)" \
              xvfb-run -a node qa/runtime/artisys-qa.mjs demo \
                --config qa/artisys-qa.config.json \
                --demo "$DEMO" \
                --preset "$PRESET" \
                --environment "$ENVIRONMENT" \
                --output qa-artifacts
          else
            FLOW="${INPUT_FLOW:-smoke}"
            VIEWPORT="${INPUT_VIEWPORT:-desktop}"
            xvfb-run -a node qa/runtime/artisys-qa.mjs run \
              --config qa/artisys-qa.config.json \
              --flow "$FLOW" \
              --environment "$ENVIRONMENT" \
              --viewport "$VIEWPORT" \
              --output qa-artifacts
          fi
      - name: Upload screenshots videos traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdv-${{ inputs.mode || 'demo' }}-${{ inputs.demo || inputs.flow || 'quick-30s' }}-${{ inputs.preset || inputs.viewport || 'reels-9x16' }}-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
