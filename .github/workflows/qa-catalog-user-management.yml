name: QA Catalog User Management

on:
  push:
    branches:
      - main
      - feature/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-catalog-user-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure Xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y xvfb
          fi
      - name: Validate catalog user QA configuration
        run: node qa/runtime/artisys-qa.mjs validate --config qa/catalog-user-management.config.json
      - name: Run catalog user management E2E
        run: xvfb-run -a node qa/runtime/artisys-qa.mjs run --config qa/catalog-user-management.config.json --environment ci --flow catalog-user-management-e2e --viewport desktop --output qa-artifacts/catalog-user-management
      - name: Upload catalog user management evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-catalog-user-management-${{ github.run_number }}
          path: qa-artifacts/catalog-user-management
          if-no-files-found: warn
          retention-days: 7
